global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

scrape_configs:
  - job_name: relaygate-gateway
    static_configs:
      - targets:
          - gateway-a:27422
          - gateway-b:27422
          - gateway-c:27422

  - job_name: relaygate-route-table
    static_configs:
      - targets:
          - rt-0:27431
          - rt-1:27431

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
