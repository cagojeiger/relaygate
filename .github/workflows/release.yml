name: release

# A release starts when VERSION lands on main. The workflow publishes every
# release unit before it creates the Git and GitHub release markers.
on:
  push:
    branches: [main]
    paths: [VERSION]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Read VERSION
        id: version
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must be an exact stable SemVer: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Validate publish credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required to publish relaygate-sdk"
            exit 1
          fi
      - name: Validate release contract
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          crate_version=$(cargo metadata --format-version 1 --no-deps | jq --raw-output '.packages[] | select(.name == "relaygate-sdk") | .version')
          if [[ "$crate_version" != "$VERSION" ]]; then
            echo "relaygate-sdk version $crate_version does not match VERSION $VERSION"
            exit 1
          fi

          grep --fixed-strings "## $VERSION " CHANGELOG.md
          cmp proto/relaygate/relay/v1/relay.proto sdk/rust/relaygate-sdk/proto/relaygate/relay/v1/relay.proto
          cargo package --locked --package relaygate-sdk

          for tag in "$RELEASE_TAG" "sdk/go/v$VERSION"; do
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              tag_commit=$(git rev-list --max-count=1 "$tag")
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                echo "$tag already points to a different commit"
                exit 1
              fi
            fi
          done

  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest

  rust-sdk:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Publish relaygate-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          cargo package --locked --package relaygate-sdk
          archive="target/package/relaygate-sdk-$VERSION.crate"
          expected_checksum=$(sha256sum "$archive" | awk '{print $1}')
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          if ! http_status=$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --user-agent "relaygate-release/$VERSION (+https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/relaygate-sdk/$VERSION"); then
            echo "failed to query crates.io"
            exit 1
          fi
          case "$http_status" in
            200)
              published_checksum=$(jq --raw-output '.version.checksum' "$response")
              if [[ "$published_checksum" != "$expected_checksum" ]]; then
                echo "published relaygate-sdk $VERSION does not match this release commit"
                exit 1
              fi
              echo "relaygate-sdk $VERSION is already published with the expected checksum"
              ;;
            404)
              cargo publish --locked --package relaygate-sdk
              ;;
            *)
              echo "unexpected crates.io response: HTTP $http_status"
              cat "$response"
              exit 1
              ;;
          esac

  tags:
    needs: [verify, image, rust-sdk]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish root and Go SDK tags
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          git fetch --force --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tag in "$RELEASE_TAG" "sdk/go/v$VERSION"; do
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              tag_commit=$(git rev-list --max-count=1 "$tag")
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                echo "$tag already points to a different commit"
                exit 1
              fi
            fi
          done

          ensure_tag() {
            local tag=$1
            local annotation=${2:-}
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              local tag_commit
              tag_commit=$(git rev-list --max-count=1 "$tag")
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                echo "$tag already points to a different commit"
                exit 1
              fi
              echo "$tag already points to this release commit"
              return
            fi

            if [[ -n "$annotation" ]]; then
              git tag --annotate "$tag" --message "$annotation" "$GITHUB_SHA"
            else
              git tag "$tag" "$GITHUB_SHA"
            fi
            git push origin "refs/tags/$tag"
          }

          ensure_tag "$RELEASE_TAG" "RelayGate $RELEASE_TAG"
          ensure_tag "sdk/go/v$VERSION"

  github-release:
    needs: [verify, tags]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "RelayGate $RELEASE_TAG"
          fi

  retain-images:
    needs: github-release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Keep the newest 20 release images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_name=${GITHUB_REPOSITORY#*/}
          endpoint="/users/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions?per_page=100"
          if ! versions=$(gh api --paginate "$endpoint" \
            --jq '.[] | select(any(.metadata.container.tags[]?; test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))) | [.created_at, (.id | tostring)] | @tsv'); then
            echo "::warning::failed to list GHCR versions; skipping retention"
            exit 0
          fi

          mapfile -t version_ids < <(
            printf '%s\n' "$versions" \
              | sed '/^$/d' \
              | sort --reverse \
              | tail --lines=+21 \
              | cut --fields=2
          )

          for version_id in "${version_ids[@]}"; do
            if ! gh api --method DELETE \
              "/users/$GITHUB_REPOSITORY_OWNER/packages/container/$package_name/versions/$version_id"; then
              echo "::warning::failed to delete GHCR package version $version_id"
            fi
          done
