name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION.gateway
      - VERSION.route-table

concurrency:
  group: release-${{ github.ref }}
  queue: max

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect component releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed VERSION files
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff-tree --no-commit-id --name-only -r "$SHA")
          else
            changed=$(git diff --name-only "$BEFORE" "$SHA")
          fi

          gateway=false
          route_table=false
          if grep -qx 'VERSION.gateway' <<<"$changed"; then
            gateway=true
          fi
          if grep -qx 'VERSION.route-table' <<<"$changed"; then
            route_table=true
          fi

          python3 - "$gateway" "$route_table" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          include = []
          if sys.argv[1] == "true":
              include.append({
                  "component": "gateway",
                  "version_file": "VERSION.gateway",
                  "image": "relaygate-gateway",
                  "target": "gateway",
              })
          if sys.argv[2] == "true":
              include.append({
                  "component": "route-table",
                  "version_file": "VERSION.route-table",
                  "image": "relaygate-route-table",
                  "target": "route-table",
              })
          print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
          PY

  release:
    name: Release ${{ matrix.component }}
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '[:space:]' < "${{ matrix.version_file }}")
          if [ -z "$version" ]; then
            echo "::error::${{ matrix.version_file }} is empty"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::${{ matrix.version_file }} must contain a Docker-compatible semantic version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.component }}-v$version" >> "$GITHUB_OUTPUT"

          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          current_version=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/contents/${{ matrix.version_file }}?ref=${{ github.event.repository.default_branch }}" \
              --jq .content \
              | base64 --decode \
              | tr -d '[:space:]'
          )
          {
            echo 'image_tags<<EOF'
            echo "${image}:${version}"
            if [ "$version" = "$current_version" ]; then
              echo "${image}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Validate existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_commit=$(git rev-list -n 1 "$tag")
          if [ "$existing_commit" != "$GITHUB_SHA" ]; then
            echo "::error::tag $tag already points to $existing_commit; bump ${{ matrix.version_file }} before merging"
            exit 1
          fi

          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists at this commit; skipping image and release recreation"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.release_exists != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.release_exists != 'true'

      - name: Log in to GHCR
        if: steps.existing.outputs.release_exists != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.existing.outputs.release_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: ${{ steps.ver.outputs.image_tags }}

      - name: Create component GitHub Release
        if: steps.existing.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          previous_tag=$(
            git tag --list '${{ matrix.component }}-v*' --sort=-version:refname \
              | grep -vxF "$tag" \
              | head -n 1 \
              || true
          )
          args=(
            "$tag"
            --title "${{ matrix.component }} v${{ steps.ver.outputs.version }}"
            --generate-notes
            --latest=false
          )
          if [ "${{ steps.existing.outputs.tag_exists }}" = "true" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [ -n "$previous_tag" ]; then
            args+=(--notes-start-tag "$previous_tag")
          fi
          gh release create "${args[@]}"

      - name: Keep recent 20 release images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.image }}
        run: |
          mapfile -t version_ids < <(
            gh api --paginate \
              "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
              --jq '.[]
                | select(any(.metadata.container.tags[]?;
                    test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$")))
                | [.created_at, (.id | tostring)]
                | @tsv' \
              | sort -r \
              | cut -f2
          )

          versions_to_keep=20
          if (( ${#version_ids[@]} <= versions_to_keep )); then
            exit 0
          fi

          for version_id in "${version_ids[@]:versions_to_keep}"; do
            gh api --method DELETE \
              "/users/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}"
          done
