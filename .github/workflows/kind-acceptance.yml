name: Kind Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/kind-acceptance.yml
      - tests/kind/**
      - crates/**
      - examples/**
      - deploy/docker/**
      - deploy/helm/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: 1.96.1
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  acceptance:
    name: RT2/GW3 Kind (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mtls
            internal-transport: mtls
            internal-source: existingSecret
          - name: plaintext
            internal-transport: plaintext
            internal-source: existingSecret
          - name: cert-manager
            internal-transport: mtls
            internal-source: certManager
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Install pinned kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ${RUNNER_TEMP}/kind" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind

      - name: Validate acceptance harness
        run: |
          bash -n tests/kind/run.sh
          bash -n tests/kind/certificates.sh
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 \
            -x tests/kind/run.sh tests/kind/certificates.sh

      - name: Run Kind acceptance
        env:
          RELAYGATE_KIND_INTERNAL_TRANSPORT: ${{ matrix.internal-transport }}
          RELAYGATE_KIND_INTERNAL_SOURCE: ${{ matrix.internal-source }}
        run: tests/kind/run.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relaygate-kind-acceptance-${{ matrix.name }}
          path: target/kind-acceptance
          if-no-files-found: error
          retention-days: 14
