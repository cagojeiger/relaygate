name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: 1.96.1

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Whitespace check
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  compose:
    name: Docker Compose E2E
    needs: [hygiene, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run single-Gateway echo
        run: docker compose up --build --abort-on-container-exit --exit-code-from probe

      - name: Reset smoke environment
        run: docker compose down --volumes --remove-orphans

      - name: Verify reconnect after Gateway restart
        run: |
          docker compose up --build -d --wait gateway listener-echo
          docker compose run --rm probe
          docker compose restart gateway
          docker compose up -d --wait gateway
          docker compose run --rm probe

      - name: Capture logs
        if: failure()
        run: docker compose logs --no-color > compose.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relaygate-compose-logs
          path: compose.log

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
