name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: 1.96.1

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Whitespace check
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Audit requirement-test traceability
        run: |
          mkdir -p target/contract
          cargo test --workspace --locked -- --list > target/contract/tests.txt
          cargo run -p relaygate-test-contract --locked -- check \
            --matrix docs/test/001-requirement-test-matrix.md \
            --spec-dir docs/spec \
            --coverage docs/test/001-executable-coverage.toml \
            --test-list target/contract/tests.txt

  compose:
    name: Docker Compose RT2/GW3 E2E
    needs: [hygiene, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build production image targets
        run: |
          docker build --file deploy/docker/Dockerfile --target gateway --tag relaygate-gateway:ci .
          docker build --file deploy/docker/Dockerfile --target route-table --tag relaygate-route-table:ci .

      - name: Start two RouteTables, three Gateways, Listeners, and continuity Pipes
        run: |
          docker compose up --build -d --wait \
            rt-0 rt-1 gateway-a gateway-b gateway-c \
            listener-a listener-b listener-c continuity-ac continuity-a-zero

      - name: Verify all local and directed remote paths
        run: |
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify unrelated pair continuity across Gateway B restart
        run: |
          docker compose restart gateway-b
          docker compose up -d --wait --no-deps gateway-b
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-client echo.b
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix

      - name: Verify rt-0 failure isolation and established Pipe continuity
        run: |
          docker compose stop rt-0
          docker compose run --rm --no-deps topology-probe \
            relaygate-echo-probe expect-shard-isolation echo.b 1 echo.c
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify rt-0 current-state recovery
        run: |
          docker compose up -d rt-0
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-client echo.b
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-client echo.shared
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-client echo.zero
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify rt-1 failure isolation and established Pipe continuity
        run: |
          docker compose stop rt-1
          docker compose run --rm --no-deps topology-probe \
            relaygate-echo-probe expect-shard-isolation echo.c 2 echo.b
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify rt-1 current-state recovery
        run: |
          docker compose up -d rt-1
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-client echo.a
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-client echo.c
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Capture logs
        if: failure()
        run: docker compose logs --no-color > compose.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relaygate-compose-logs
          path: compose.log

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
