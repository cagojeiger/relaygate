[package]
name = "relaygate-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Public Rust SDK for the RelayGate relay data plane"
repository = "https://github.com/cagojeiger/relaygate"
readme = "README.md"
include = [
    "/README.md",
    "/build.rs",
    "/examples/**",
    "/proto/**",
    "/src/**",
]

[dependencies]
prost = "=0.14.4"
ring = "=0.17.14"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "=0.1.19"
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "tls-native-roots"] }
tonic-prost = "=0.14.6"
uuid = { version = "=1.24.1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = { version = "=0.14.6", default-features = false }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
