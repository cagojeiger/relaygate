clusterDomain: cluster.local

imagePullSecrets: []

credentials:
  # 차트는 credential을 만들거나 영속화하지 않는다. workload 시작 전에 release
  # namespace에 이 Secret이 있어야 한다.
  existingSecret: relaygate-credentials
  internalGatewayKeysKey: internal-gateway-keys
  clusterTokenKey: cluster-token
  nextClusterTokenKey: next-cluster-token
  # Secret data는 pod template에 포함되지 않는다. 값을 바꾼 뒤 이 token도 새 값으로
  # 바꾸면 Gateway와 RT가 startup credential을 다시 읽도록 restart된다.
  reloadToken: ""

tls:
  # SDK-facing TLS와 cluster-internal mTLS는 별도 trust domain으로 운영한다.
  # 차트는 edge certificate, Issuer와 CA를 만들지 않는다.
  edge:
    existingSecret: relaygate-edge-tls
    # customCa는 caKey를 mount하고, webPkiRoots는 공개 root set을 사용한다.
    trustMode: customCa
    caKey: ca.crt
    certificateKey: tls.crt
    privateKeyKey: tls.key
    serverName: relaygate-gateway.internal
    reloadToken: ""
  internal:
    # existingSecret(기본)은 하나의 사전 생성 Secret을 사용한다. certManager는
    # platform Issuer로 Gateway/RouteTable leaf certificate를 각각 발급한다.
    source: existingSecret
    existingSecret: relaygate-internal-tls
    caKey: ca.crt
    gatewayCertificateKey: gateway.crt
    gatewayPrivateKeyKey: gateway.key
    routeTableCertificateKey: route-table.crt
    routeTablePrivateKeyKey: route-table.key
    gatewayServerName: relaygate-gateway.internal
    routeTableServerName: relaygate-route-table.internal
    reloadToken: ""
    certManager:
      issuerRef:
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io
      # Issuer CA의 public trust bundle이다. leaf private key Secret과 분리한다.
      trustSecret:
        name: ""
        key: ca.crt

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

metrics:
  # relaygate-server가 제공하는 low-cardinality Prometheus endpoint다.
  # Service는 cluster 내부 전용이며 payload와 credential은 노출하지 않는다.
  enabled: true
  intervalMs: 5000
  gatewayPort: 27422
  routeTablePort: 27431

gateway:
  replicaCount: 3

  image:
    repository: ghcr.io/cagojeiger/relaygate-gateway
    tag: "0.2.2"
    pullPolicy: IfNotPresent

  sdkPort: 27420
  peerPort: 27421

  service:
    type: ClusterIP
    port: 27420
    annotations: {}
    loadBalancerClass: ""
    externalTrafficPolicy: Cluster

  log: info
  logFormat: json
  statsIntervalMs: null

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  drainTimeoutMs: 120000
  terminationGracePeriodSeconds: 135

  # capacity와 timeout override를 추가할 수 있다. 차트가 관리하는 identity, address,
  # directory와 credential 변수는 재정의할 수 없다.
  extraEnv: []

routeTable:
  # 하나의 StatefulSet이 logical shard rt-0 .. rt-(shardCount-1)를 각각 한 pod로
  # 실행한다. replica 수가 아니라 shard 수이며 일반적인 scale 변경 대상이 아니다.
  # ShardDirectory ConfigMap 크기를 제한하기 위해 1..2048만 허용한다.
  shardCount: 2

  image:
    repository: ghcr.io/cagojeiger/relaygate-route-table
    tag: "0.2.0"
    pullPolicy: IfNotPresent

  port: 27430
  leaseTtlMs: 30000
  log: info
  logFormat: json

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30

  # queue, frame과 handshake override를 추가할 수 있다. 차트가 관리하는 identity,
  # address, directory와 credential 변수는 재정의할 수 없다.
  extraEnv: []
