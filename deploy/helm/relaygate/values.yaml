# RelayGate의 현재 내부 Gateway/RouteTable 통신은 bounded plain-TCP key adapter를
# 사용한다. 신뢰된 network 또는 channel identity와 integrity를 제공하는 transport
# 계층 안에서만 배포한다.
clusterDomain: cluster.local

imagePullSecrets: []

internalTransport:
  # 현재 runtime의 local/CI plain-TCP key adapter를 사용한다는 명시적 opt-in이다.
  # namespace network가 신뢰되거나 별도 mTLS/service identity 계층이 있을 때만 true로 둔다.
  trustedLocalAdapter: false

credentials:
  # 차트는 credential을 만들거나 영속화하지 않는다. workload 시작 전에 release
  # namespace에 이 Secret이 있어야 한다.
  existingSecret: relaygate-credentials
  internalGatewayKeysKey: internal-gateway-keys
  clientKeysKey: client-keys
  # Secret data는 pod template에 포함되지 않는다. 값을 바꾼 뒤 이 token도 새 값으로
  # 바꾸면 Gateway와 RT가 startup credential을 다시 읽도록 restart된다.
  reloadToken: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

gateway:
  replicaCount: 3

  image:
    repository: ghcr.io/cagojeiger/relaygate-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  sdkPort: 27420
  peerPort: 27421

  service:
    port: 27420
    annotations: {}

  log: info
  logFormat: json
  statsIntervalMs: null

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30

  # capacity와 timeout override를 추가할 수 있다. 차트가 관리하는 identity, address,
  # directory와 credential 변수는 재정의할 수 없다.
  extraEnv: []

routeTable:
  # 하나의 StatefulSet이 logical shard rt-0 .. rt-(shardCount-1)를 각각 한 pod로
  # 실행한다. replica 수가 아니라 shard 수이며 일반적인 scale 변경 대상이 아니다.
  shardCount: 2

  image:
    repository: ghcr.io/cagojeiger/relaygate-route-table
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  port: 27430
  leaseTtlMs: 30000
  log: info
  logFormat: json

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30

  # queue, frame과 handshake override를 추가할 수 있다. 차트가 관리하는 identity,
  # address, directory와 credential 변수는 재정의할 수 없다.
  extraEnv: []
