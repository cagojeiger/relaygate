clusterDomain: cluster.local

imagePullSecrets: []

credentials:
  # Workload가 release namespace의 operator-managed credential을 읽는다.
  existingSecret: relaygate-credentials
  internalGatewayKeysKey: internal-gateway-keys
  clusterTokenKey: cluster-token
  nextClusterTokenKey: next-cluster-token
  # Credential 변경과 함께 값을 바꾸면 Gateway/RT가 startup config를 다시 읽는다.
  reloadToken: ""

tls:
  # SDK edge와 internal mTLS는 별도 trust domain이며 platform이 Issuer/CA를 소유한다.
  edge:
    existingSecret: relaygate-edge-tls
    # customCa는 caKey를 mount하고, webPkiRoots는 공개 root set을 사용한다.
    trustMode: customCa
    caKey: ca.crt
    certificateKey: tls.crt
    privateKeyKey: tls.key
    serverName: relaygate-gateway.internal
    reloadToken: ""
  internal:
    mode: mtls
    # 설치된 Reloader가 인증서·trust Secret 변경을 StatefulSet에 적용한다.
    autoReload: false
    # existingSecret 또는 platform Issuer가 발급하는 role별 leaf를 사용한다.
    source: existingSecret
    existingSecret: relaygate-internal-tls
    caKey: ca.crt
    gatewayCertificateKey: gateway.crt
    gatewayPrivateKeyKey: gateway.key
    routeTableCertificateKey: route-table.crt
    routeTablePrivateKeyKey: route-table.key
    gatewayServerName: relaygate-gateway.internal
    routeTableServerName: relaygate-route-table.internal
    reloadToken: ""
    certManager:
      issuerRef:
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io
      # Issuer CA의 public trust bundle. Leaf private key Secret과 분리한다.
      trustSecret:
        name: ""
        key: ca.crt

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

metrics:
  # Cluster-internal low-cardinality Prometheus endpoint.
  enabled: true
  intervalMs: 5000
  gatewayPort: 27422
  routeTablePort: 27431

gateway:
  replicaCount: 3

  image:
    repository: ghcr.io/cagojeiger/relaygate-gateway
    tag: "0.2.2"
    pullPolicy: IfNotPresent

  sdkPort: 27420
  peerPort: 27421

  service:
    type: ClusterIP
    port: 27420
    annotations: {}
    loadBalancerClass: ""
    externalTrafficPolicy: Cluster

  log: info
  logFormat: json
  statsIntervalMs: null

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  drainTimeoutMs: 120000
  terminationGracePeriodSeconds: 135

  # Chart-managed 값 이외의 capacity/timeout override.
  extraEnv: []

routeTable:
  # StatefulSet ordinal별 logical shard 수. 허용 범위 1..2048.
  shardCount: 2

  image:
    repository: ghcr.io/cagojeiger/relaygate-route-table
    tag: "0.2.0"
    pullPolicy: IfNotPresent

  port: 27430
  leaseTtlMs: 30000
  log: info
  logFormat: json

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30

  # Chart-managed 값 이외의 queue/frame/handshake override.
  extraEnv: []
