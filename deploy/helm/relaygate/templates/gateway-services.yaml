apiVersion: v1
kind: Service
metadata:
  name: {{ include "relaygate.gatewayServiceName" . | quote }}
  labels:
    {{- include "relaygate.labels" (dict "root" . "component" "gateway") | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  {{- if and (eq .Values.gateway.service.type "LoadBalancer") .Values.gateway.service.loadBalancerClass }}
  loadBalancerClass: {{ .Values.gateway.service.loadBalancerClass | quote }}
  {{- end }}
  {{- if eq .Values.gateway.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.gateway.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "relaygate.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: sdk
      port: {{ .Values.gateway.service.port }}
      targetPort: sdk
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relaygate.gatewayPeerServiceName" . | quote }}
  labels:
    {{- include "relaygate.labels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "relaygate.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: peer
      port: {{ .Values.gateway.peerPort }}
      targetPort: peer
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.gatewayPort }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
