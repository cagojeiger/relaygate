{{- $root := . }}
{{- range $index := until (int .Values.routeTable.shardCount) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relaygate.routeTableName" (dict "root" $root "index" $index) }}
  labels:
    {{- include "relaygate.labels" (dict "root" $root "component" "route-table") | nindent 4 }}
    relaygate.io/shard: {{ printf "rt-%d" $index | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "relaygate.selectorLabels" (dict "root" $root "component" "route-table") | nindent 4 }}
    relaygate.io/shard: {{ printf "rt-%d" $index | quote }}
  ports:
    - name: route-table
      port: {{ $root.Values.routeTable.port }}
      targetPort: route-table
      protocol: TCP
---
{{- end }}
