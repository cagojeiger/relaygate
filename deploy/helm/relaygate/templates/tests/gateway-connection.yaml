apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "relaygate.fullname" . }}-test-gateway"
  labels:
    {{- include "relaygate.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 30
  serviceAccountName: {{ include "relaygate.serviceAccountName" . | quote }}
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: check-gateway
      image: {{ printf "%s:%s" .Values.gateway.image.repository .Values.gateway.image.tag | quote }}
      imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      args:
        - check
        - "{{ include "relaygate.gatewayServiceName" . }}:{{ .Values.gateway.service.port }}"
