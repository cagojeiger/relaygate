syntax = "proto3";

package relaygate.control.v1;

option go_package = "github.com/cagojeiger/relaygate/internal/gen/control/v1;controlv1";

service GatewayControl {
  rpc Connect(stream ControlRequest) returns (stream ControlResponse);
  rpc AdmitOpen(AdmitOpenRequest) returns (AdmitOpenResponse);
}

message ControlRequest {
  oneof message {
    Hello hello = 1;
    FullSnapshot full_snapshot = 2;
    BindingMutation binding_mutation = 3;
  }
}

message ControlResponse {
  oneof message {
    SessionOpened session_opened = 1;
    SnapshotAccepted snapshot_accepted = 2;
    MutationResult mutation_result = 3;
  }
}

message Hello {
  string cluster_epoch = 1;
  string gateway_id = 2;
  string gateway_instance_id = 3;
  string relay_address = 4;
}

message SessionRef {
  string cluster_epoch = 1;
  string authority_id = 2;
  string control_session_id = 3;
  string gateway_id = 4;
  string gateway_instance_id = 5;
}

message SessionOpened {
  SessionRef session = 1;
  uint64 gateway_generation = 2;
  repeated BindingSlot owned_bindings = 3;
}

message FullSnapshot {
  SessionRef session = 1;
  repeated BindingSlot bindings = 2;
}

enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  PRESENCE_STATE_REBUILDING = 1;
  PRESENCE_STATE_COMPLETE = 2;
}

message SnapshotAccepted {
  PresenceState presence = 1;
}

message BindingMutation {
  SessionRef session = 1;
  oneof mutation {
    InstallBinding install = 2;
    RemoveBinding remove = 3;
  }
}

message BindingKey {
  string client_id = 1;
  string endpoint_pattern = 2;
  string target_id = 3;
}

message ListenerBindingRef {
  string gateway_instance_id = 1;
  string listener_binding_id = 2;
  // Set when the ref is returned outside its owning control session, such as
  // in OpenContext. Session-bound snapshots and mutations derive GatewayID
  // from SessionRef and omit this field.
  string gateway_id = 3;
}

message BindingSlot {
  BindingKey key = 1;
  uint64 generation = 2;
  ListenerBindingRef ref = 3;
}

message InstallBinding {
  BindingKey key = 1;
  uint64 expected_generation = 2;
  ListenerBindingRef expected_ref = 3;
  ListenerBindingRef new_ref = 4;
}

message RemoveBinding {
  BindingKey key = 1;
  uint64 expected_generation = 2;
  ListenerBindingRef expected_ref = 3;
}

enum MutationCode {
  MUTATION_CODE_UNSPECIFIED = 0;
  MUTATION_CODE_APPLIED = 1;
  MUTATION_CODE_ALREADY_APPLIED = 2;
  MUTATION_CODE_REJECTED = 3;
  MUTATION_CODE_CAPACITY_REACHED = 4;
}

message MutationResult {
  MutationCode code = 1;
  BindingSlot slot = 2;
  string error = 3;
  bool same_gateway_owner = 4;
}

message AuthContext {
  string client_session_id = 1;
  string client_id = 2;
  string api_key_id = 3;
  string auth_revision = 4;
}

message AdmitOpenRequest {
  SessionRef session = 1;
  AuthContext auth = 2;
  string endpoint = 3;
  string target_id = 4;
}

message OpenContext {
  string cluster_epoch = 1;
  string authority_id = 2;
  string attempt_id = 3;
  AuthContext auth = 4;
  BindingSlot binding = 5;
  string ingress_gateway_id = 6;
  string ingress_gateway_instance_id = 7;
  string ingress_control_session_id = 8;
  string owner_relay_address = 9;
  int64 expires_at_unix_millis = 10;
}

message AdmitOpenResponse {
  OpenContext context = 1;
}
