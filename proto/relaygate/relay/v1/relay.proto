syntax = "proto3";

package relaygate.relay.v1;

option go_package = "github.com/cagojeiger/relaygate/internal/gen/relay/v1;relayv1";

service Relay {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

message ConnectRequest {
  oneof message {
    Authenticate authenticate = 1;
    BindListener bind_listener = 2;
    UnbindListener unbind_listener = 3;
  }
}

message ConnectResponse {
  oneof message {
    ClientSessionOpened client_session_opened = 1;
    ListenerBound listener_bound = 2;
    ListenerUnbound listener_unbound = 3;
  }
}

message Authenticate {
  string client_id = 1;
  string api_key_id = 2;
  string api_key = 3;
}

message ClientSessionRef {
  string client_session_id = 1;
  string client_id = 2;
  string api_key_id = 3;
  string auth_revision = 4;
}

message ClientSessionOpened {
  ClientSessionRef session = 1;
}

message BindListener {
  string endpoint_pattern = 1;
  string target_id = 2;
}

message UnbindListener {
  string listener_binding_id = 1;
}

message ListenerBinding {
  string listener_binding_id = 1;
  string endpoint_pattern = 2;
  string target_id = 3;
}

message ListenerBound {
  ListenerBinding binding = 1;
}

message ListenerUnbound {
  string listener_binding_id = 1;
}
