x-relaygate: &relaygate
  image: relaygate:dev
  command: ["-config", "/etc/relaygate/relaygate.yaml"]
  stop_grace_period: 15s
  restart: unless-stopped

x-relaygate-environment: &relaygate-environment
  RELAYGATE_RAFT_BIND_ADDRESS: 0.0.0.0:27400
  RELAYGATE_CONTROL_BIND_ADDRESS: 0.0.0.0:27410
  RELAYGATE_INTERNAL_RELAY_BIND_ADDRESS: 0.0.0.0:27430
  RELAYGATE_ADMIN_BIND_ADDRESS: 0.0.0.0:27490
  RELAYGATE_CONTROL_CLUSTER_EPOCH: local-compose-1
  RELAYGATE_GATEWAY_CONTROL_ENDPOINTS: >-
    ["relaygate-1:27410","relaygate-2:27410","relaygate-3:27410"]

services:
  relaygate-1:
    <<: *relaygate
    build:
      context: .
      args:
        VERSION: dev
    environment:
      <<: *relaygate-environment
      RELAYGATE_GATEWAY_ID: gateway-1
      RELAYGATE_RAFT_NODE_ID: node-1
      RELAYGATE_RAFT_ADVERTISE_ADDRESS: relaygate-1:27400
      RELAYGATE_INTERNAL_RELAY_ADVERTISE_ADDRESS: relaygate-1:27430
      RELAYGATE_RAFT_BOOTSTRAP: "true"
      RELAYGATE_RAFT_BOOTSTRAP_VOTERS: >-
        [{"node_id":"node-1","address":"relaygate-1:27400"},{"node_id":"node-2","address":"relaygate-2:27400"},{"node_id":"node-3","address":"relaygate-3:27400"}]
    volumes:
      - relaygate-node-1-data:/var/lib/relaygate
    ports:
      - "127.0.0.1:27491:27490"
      - "127.0.0.1:27411:27410"

  relaygate-2:
    <<: *relaygate
    environment:
      <<: *relaygate-environment
      RELAYGATE_GATEWAY_ID: gateway-2
      RELAYGATE_RAFT_NODE_ID: node-2
      RELAYGATE_RAFT_ADVERTISE_ADDRESS: relaygate-2:27400
      RELAYGATE_INTERNAL_RELAY_ADVERTISE_ADDRESS: relaygate-2:27430
      RELAYGATE_RAFT_BOOTSTRAP: "false"
    volumes:
      - relaygate-node-2-data:/var/lib/relaygate
    ports:
      - "127.0.0.1:27492:27490"
      - "127.0.0.1:27412:27410"

  relaygate-3:
    <<: *relaygate
    environment:
      <<: *relaygate-environment
      RELAYGATE_GATEWAY_ID: gateway-3
      RELAYGATE_RAFT_NODE_ID: node-3
      RELAYGATE_RAFT_ADVERTISE_ADDRESS: relaygate-3:27400
      RELAYGATE_INTERNAL_RELAY_ADVERTISE_ADDRESS: relaygate-3:27430
      RELAYGATE_RAFT_BOOTSTRAP: "false"
    volumes:
      - relaygate-node-3-data:/var/lib/relaygate
    ports:
      - "127.0.0.1:27493:27490"
      - "127.0.0.1:27413:27410"

volumes:
  relaygate-node-1-data:
  relaygate-node-2-data:
  relaygate-node-3-data:
