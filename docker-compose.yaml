x-relaygate: &relaygate
  image: ${RELAYGATE_IMAGE:-relaygate:dev}
  build:
    context: .
    args:
      VERSION: dev
  command: ["-config", "/etc/relaygate/relaygate.yaml"]
  stop_grace_period: 15s
  restart: "no"

x-controller-environment: &controller-environment
  RELAYGATE_RUNTIME_ROLE: controller
  RELAYGATE_RAFT_DATA_DIR: /var/lib/relaygate
  RELAYGATE_RAFT_BIND_ADDRESS: 0.0.0.0:27400
  RELAYGATE_CONTROL_BIND_ADDRESS: 0.0.0.0:27410
  RELAYGATE_ADMIN_BIND_ADDRESS: 0.0.0.0:27490
  RELAYGATE_CONTROL_CLUSTER_EPOCH: ${RELAYGATE_COHORT_EPOCH:-local-compose-1}
  # This manifest is initial-cluster input only. Raft's committed membership is
  # authoritative after bootstrap; every controller receives the same manifest
  # so a fresh, empty three-controller project can form deterministically.
  RELAYGATE_RAFT_BOOTSTRAP_VOTERS: >-
    [{"node_id":"controller-1","address":"controller-1:27400"},{"node_id":"controller-2","address":"controller-2:27400"},{"node_id":"controller-3","address":"controller-3:27400"}]

x-gateway-environment: &gateway-environment
  RELAYGATE_RUNTIME_ROLE: gateway
  RELAYGATE_CONTROL_CLUSTER_EPOCH: ${RELAYGATE_COHORT_EPOCH:-local-compose-1}
  RELAYGATE_GATEWAY_CONTROL_ENDPOINTS: >-
    ["controller-1:27410","controller-2:27410","controller-3:27410"]
  RELAYGATE_INTERNAL_RELAY_BIND_ADDRESS: 0.0.0.0:27430
  RELAYGATE_ADMIN_BIND_ADDRESS: 0.0.0.0:27490

services:
  controller-1:
    <<: *relaygate
    environment:
      <<: *controller-environment
      RELAYGATE_RAFT_NODE_ID: controller-1
      RELAYGATE_RAFT_ADVERTISE_ADDRESS: controller-1:27400
      RELAYGATE_RAFT_BOOTSTRAP: "${RELAYGATE_BOOTSTRAP_ONCE:-false}"
    volumes:
      - controller-1-data:/var/lib/relaygate
    ports:
      - "127.0.0.1:27591:27490"

  controller-2:
    <<: *relaygate
    environment:
      <<: *controller-environment
      RELAYGATE_RAFT_NODE_ID: controller-2
      RELAYGATE_RAFT_ADVERTISE_ADDRESS: controller-2:27400
      RELAYGATE_RAFT_BOOTSTRAP: "false"
    volumes:
      - controller-2-data:/var/lib/relaygate
    ports:
      - "127.0.0.1:27592:27490"

  controller-3:
    <<: *relaygate
    environment:
      <<: *controller-environment
      RELAYGATE_RAFT_NODE_ID: controller-3
      RELAYGATE_RAFT_ADVERTISE_ADDRESS: controller-3:27400
      RELAYGATE_RAFT_BOOTSTRAP: "false"
    volumes:
      - controller-3-data:/var/lib/relaygate
    ports:
      - "127.0.0.1:27593:27490"

  gateway-1:
    <<: *relaygate
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    environment:
      <<: *gateway-environment
      RELAYGATE_GATEWAY_ID: gateway-1
      RELAYGATE_INTERNAL_RELAY_ADVERTISE_ADDRESS: gateway-1:27430
    ports:
      - "127.0.0.1:27594:27490"

  gateway-2:
    <<: *relaygate
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    environment:
      <<: *gateway-environment
      RELAYGATE_GATEWAY_ID: gateway-2
      RELAYGATE_INTERNAL_RELAY_ADVERTISE_ADDRESS: gateway-2:27430
    ports:
      - "127.0.0.1:27595:27490"

volumes:
  controller-1-data:
  controller-2-data:
  controller-3-data:
