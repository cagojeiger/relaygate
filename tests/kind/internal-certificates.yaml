apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: relaygate-gw-internal-tls
spec:
  secretName: relaygate-gw-internal-tls
  dnsNames:
    - relaygate-gateway.internal
  usages:
    - digital signature
    - server auth
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: relaygate-internal
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: relaygate-rt-internal-tls
spec:
  secretName: relaygate-rt-internal-tls
  dnsNames:
    - relaygate-route-table.internal
  usages:
    - digital signature
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: relaygate-internal
    kind: Issuer
    group: cert-manager.io
