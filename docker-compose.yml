name: relaygate-local

volumes:
  relaygate-tls:

x-runtime: &runtime
  image: relaygate:dev
  init: true
  read_only: true
  restart: "no"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=16m,mode=1777

x-directory-volume: &directory-volume
  type: bind
  source: ./deploy/docker/shard-directory.json
  target: /etc/relaygate/shard-directory.json
  read_only: true

x-tls-volume: &tls-volume
  type: volume
  source: relaygate-tls
  target: /etc/relaygate/tls
  read_only: true

x-gateway-environment: &gateway-environment
  RELAYGATE_BIND_ADDR: 0.0.0.0:27420
  RELAYGATE_PEER_BIND_ADDR: 0.0.0.0:27421
  RELAYGATE_CLUSTER_TOKEN: relaygate-local-cluster-token
  RELAYGATE_RT_SHARD_DIRECTORY_PATH: /etc/relaygate/shard-directory.json
  RELAYGATE_INTERNAL_GATEWAY_KEYS: gateway-a=dev-gateway-a-v1,gateway-b=dev-gateway-b-v1,gateway-c=dev-gateway-c-v1
  RELAYGATE_SDK_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
  RELAYGATE_SDK_TLS_CERT_PATH: /etc/relaygate/tls/gateway.crt
  RELAYGATE_SDK_TLS_KEY_PATH: /etc/relaygate/tls/gateway.key
  RELAYGATE_SDK_TLS_SERVER_NAME: relaygate-gateway.internal
  RELAYGATE_INTERNAL_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
  RELAYGATE_INTERNAL_TLS_CERT_PATH: /etc/relaygate/tls/gateway.crt
  RELAYGATE_INTERNAL_TLS_KEY_PATH: /etc/relaygate/tls/gateway.key
  RELAYGATE_PEER_TLS_SERVER_NAME: relaygate-gateway.internal
  RELAYGATE_RT_TLS_SERVER_NAME: relaygate-route-table.internal
  RELAYGATE_LOG: info
  RELAYGATE_STATS_INTERVAL_MS: "1000"
  RELAYGATE_METRICS_BIND_ADDR: 0.0.0.0:27422
  RELAYGATE_METRICS_INTERVAL_MS: "1000"
  RELAYGATE_SDK_HEARTBEAT_IDLE_MS: "60000"
  RELAYGATE_SDK_HEARTBEAT_TIMEOUT_MS: "20000"
  RELAYGATE_PEER_HEARTBEAT_IDLE_MS: "60000"
  RELAYGATE_PEER_HEARTBEAT_TIMEOUT_MS: "20000"
  RELAYGATE_PEER_IDLE_TIMEOUT_MS: "300000"

x-gateway: &gateway
  <<: *runtime
  command: ["relaygate-server", "gateway"]
  volumes:
    - *directory-volume
    - *tls-volume
  depends_on:
    tls-init:
      condition: service_healthy
    rt-0:
      condition: service_started
    rt-1:
      condition: service_started
  healthcheck:
    test: ["CMD", "relaygate-server", "check", "127.0.0.1:27420"]
    interval: 1s
    timeout: 1s
    retries: 30
    start_period: 1s
  stop_grace_period: 5s

x-route-table-environment: &route-table-environment
  RELAYGATE_RT_BIND_ADDR: 0.0.0.0:27430
  RELAYGATE_RT_SHARD_DIRECTORY_PATH: /etc/relaygate/shard-directory.json
  RELAYGATE_RT_LEASE_TTL_MS: "3000"
  RELAYGATE_INTERNAL_GATEWAY_KEYS: gateway-a=dev-gateway-a-v1,gateway-b=dev-gateway-b-v1,gateway-c=dev-gateway-c-v1
  RELAYGATE_INTERNAL_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
  RELAYGATE_INTERNAL_TLS_CERT_PATH: /etc/relaygate/tls/route-table.crt
  RELAYGATE_INTERNAL_TLS_KEY_PATH: /etc/relaygate/tls/route-table.key
  RELAYGATE_LOG: info
  RELAYGATE_METRICS_BIND_ADDR: 0.0.0.0:27431

x-route-table: &route-table
  <<: *runtime
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
    target: test
  command: ["relaygate-server", "route-table"]
  volumes:
    - *directory-volume
    - *tls-volume
  depends_on:
    tls-init:
      condition: service_healthy
  stop_grace_period: 5s

x-listener: &listener
  <<: *runtime
  command: ["relaygate-echo-listener"]
  volumes:
    - *tls-volume
  stop_grace_period: 5s

services:
  tls-init:
    image: alpine:3.22
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache openssl >/dev/null
        if ! test -f /tls/.ready; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=relaygate-local-ca' \
            -keyout /tls/ca.key -out /tls/ca.crt >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -subj '/CN=relaygate-gateway.internal' \
            -keyout /tls/gateway.key -out /tmp/gateway.csr >/dev/null 2>&1
          printf '%s\n' \
            'subjectAltName=DNS:relaygate-gateway.internal,DNS:gateway,DNS:gateway-a,DNS:gateway-b,DNS:gateway-c' \
            'extendedKeyUsage=serverAuth,clientAuth' >/tmp/gateway.ext
          openssl x509 -req -days 2 -sha256 \
            -in /tmp/gateway.csr -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial \
            -extfile /tmp/gateway.ext -out /tls/gateway.crt >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -subj '/CN=relaygate-route-table.internal' \
            -keyout /tls/route-table.key -out /tmp/route-table.csr >/dev/null 2>&1
          printf '%s\n' \
            'subjectAltName=DNS:relaygate-route-table.internal,DNS:rt-0,DNS:rt-1' \
            'extendedKeyUsage=serverAuth,clientAuth' >/tmp/route-table.ext
          openssl x509 -req -days 2 -sha256 \
            -in /tmp/route-table.csr -CA /tls/ca.crt -CAkey /tls/ca.key -CAserial /tls/ca.srl \
            -extfile /tmp/route-table.ext -out /tls/route-table.crt >/dev/null 2>&1
          chown 10001:10001 /tls/*.crt /tls/*.key
          chmod 0444 /tls/*.crt
          chmod 0440 /tls/*.key
          touch /tls/.ready
        fi
        exec tail -f /dev/null
    volumes:
      - relaygate-tls:/tls
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tls/ca.crt && test -s /tls/gateway.crt && test -s /tls/gateway.key && test -s /tls/route-table.crt && test -s /tls/route-table.key",
        ]
      interval: 1s
      timeout: 1s
      retries: 30

  rt-0:
    <<: *route-table
    environment:
      <<: *route-table-environment
      RELAYGATE_RT_SHARD_ID: rt-0

  rt-1:
    <<: *route-table
    environment:
      <<: *route-table-environment
      RELAYGATE_RT_SHARD_ID: rt-1

  gateway-a:
    <<: *gateway
    environment:
      <<: *gateway-environment
      RELAYGATE_GATEWAY_NAME: gateway-a
      RELAYGATE_GATEWAY_LOCATOR: gateway-a:27421
    ports:
      - "127.0.0.1:27420:27420"

  gateway-b:
    <<: *gateway
    environment:
      <<: *gateway-environment
      RELAYGATE_GATEWAY_NAME: gateway-b
      RELAYGATE_GATEWAY_LOCATOR: gateway-b:27421

  gateway-c:
    <<: *gateway
    environment:
      <<: *gateway-environment
      RELAYGATE_GATEWAY_NAME: gateway-c
      RELAYGATE_GATEWAY_LOCATOR: gateway-c:27421

  listener-a:
    <<: *listener
    environment:
      RELAYGATE_ADDR: gateway-a:27420
      RELAYGATE_CLUSTER_TOKEN: relaygate-local-cluster-token
      RELAYGATE_DESTINATIONS: 11111111-1111-4111-8111-111111111111
      RELAYGATE_SDK_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
      RELAYGATE_SDK_TLS_SERVER_NAME: relaygate-gateway.internal
      RELAYGATE_LOG: relaygate_sdk=info
    depends_on:
      gateway-a:
        condition: service_healthy

  listener-b:
    <<: *listener
    environment:
      RELAYGATE_ADDR: gateway-b:27420
      RELAYGATE_CLUSTER_TOKEN: relaygate-local-cluster-token
      RELAYGATE_DESTINATIONS: 22222222-2222-4222-8222-222222222222,44444444-4444-4444-8444-444444444444
      RELAYGATE_SDK_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
      RELAYGATE_SDK_TLS_SERVER_NAME: relaygate-gateway.internal
      RELAYGATE_LOG: relaygate_sdk=info
    depends_on:
      gateway-b:
        condition: service_healthy

  listener-c:
    <<: *listener
    environment:
      RELAYGATE_ADDR: gateway-c:27420
      RELAYGATE_CLUSTER_TOKEN: relaygate-local-cluster-token
      RELAYGATE_DESTINATIONS: 33333333-3333-4333-8333-333333333333,44444444-4444-4444-8444-444444444444,55555555-5555-4555-8555-555555555555
      RELAYGATE_SDK_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
      RELAYGATE_SDK_TLS_SERVER_NAME: relaygate-gateway.internal
      RELAYGATE_LOG: relaygate_sdk=info
    depends_on:
      gateway-c:
        condition: service_healthy

  continuity-ac:
    <<: *runtime
    command: ["relaygate-echo-probe", "continuity"]
    volumes:
      - *tls-volume
    environment:
      RELAYGATE_CONTINUITY_ADDR: gateway-a:27420
      RELAYGATE_CONTINUITY_DESTINATION_ID: 33333333-3333-4333-8333-333333333333
      RELAYGATE_CONTINUITY_STATE: /tmp/relaygate-continuity.state
      RELAYGATE_CLUSTER_TOKEN: relaygate-local-cluster-token
      RELAYGATE_SDK_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
      RELAYGATE_SDK_TLS_SERVER_NAME: relaygate-gateway.internal
      RELAYGATE_LOG: relaygate_sdk=info
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-c:
        condition: service_healthy
      listener-c:
        condition: service_started
    stop_grace_period: 5s

  continuity-a-zero:
    <<: *runtime
    command: ["relaygate-echo-probe", "continuity"]
    volumes:
      - *tls-volume
    environment:
      RELAYGATE_CONTINUITY_ADDR: gateway-a:27420
      RELAYGATE_CONTINUITY_DESTINATION_ID: 55555555-5555-4555-8555-555555555555
      RELAYGATE_CONTINUITY_STATE: /tmp/relaygate-continuity.state
      RELAYGATE_CLUSTER_TOKEN: relaygate-local-cluster-token
      RELAYGATE_SDK_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
      RELAYGATE_SDK_TLS_SERVER_NAME: relaygate-gateway.internal
      RELAYGATE_LOG: relaygate_sdk=info
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-c:
        condition: service_healthy
      listener-c:
        condition: service_started
    stop_grace_period: 5s

  topology-probe:
    <<: *runtime
    command: ["relaygate-echo-probe", "matrix"]
    volumes:
      - *tls-volume
    environment:
      RELAYGATE_GATEWAYS: gateway-a:27420,gateway-b:27420,gateway-c:27420
      RELAYGATE_CLUSTER_TOKEN: relaygate-local-cluster-token
      RELAYGATE_SDK_TLS_CA_PATH: /etc/relaygate/tls/ca.crt
      RELAYGATE_SDK_TLS_SERVER_NAME: relaygate-gateway.internal
      RELAYGATE_LOG: relaygate_sdk=info
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
      gateway-c:
        condition: service_healthy
      listener-a:
        condition: service_started
      listener-b:
        condition: service_started
      listener-c:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: ["observability"]
    read_only: true
    restart: "no"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:size=256m,mode=1777
    ports:
      - "127.0.0.1:${RELAYGATE_PROMETHEUS_PORT:-29090}:9090"
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
      gateway-c:
        condition: service_healthy
      rt-0:
        condition: service_started
      rt-1:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.1
    profiles: ["observability"]
    restart: "no"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${RELAYGATE_GRAFANA_PORT:-23000}:3000"
    depends_on:
      prometheus:
        condition: service_started

  observability-probe:
    image: grafana/grafana:13.1.1
    profiles: ["observability"]
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until curl -fsS http://prometheus:9090/-/ready >/dev/null; do
          attempts=$$((attempts + 1)); test "$$attempts" -lt 60; sleep 1
        done
        attempts=0
        until curl -fsSG --data-urlencode 'query=count(up{job=~"relaygate-(gateway|route-table)"} == 1)' \
          http://prometheus:9090/api/v1/query | grep -q '"5"'; do
          attempts=$$((attempts + 1))
          if test "$$attempts" -ge 60; then
            echo 'Prometheus RelayGate target count did not converge to 5' >&2
            exit 1
          fi
          sleep 1
        done
        for expression in \
          'sum(relaygate_gateway_publish_results_total{outcome="success"}) > 0' \
          'sum(relaygate_gateway_route_dependency_transitions_total{current="ready"}) > 0' \
          'sum(relaygate_gateway_route_connection_attempts_total{outcome="success"}) > 0' \
          'sum(relaygate_gateway_peer_handshakes_total{outcome="success"}) > 0' \
          'sum(relaygate_route_table_handshakes_total{outcome="success"}) > 0'; do
          attempts=0
          until curl -fsSG --data-urlencode "query=$$expression" \
            http://prometheus:9090/api/v1/query | grep -Fq '"result":[{'; do
            attempts=$$((attempts + 1))
            if test "$$attempts" -ge 60; then
              echo "Prometheus expression did not converge: $$expression" >&2
              exit 1
            fi
            sleep 1
          done
        done
        for expression in \
          'histogram_quantile(0.95, sum by (le) (relaygate_gateway_dial_duration_seconds_bucket)) > 0' \
          'histogram_quantile(0.95, sum by (le) (relaygate_route_table_request_duration_seconds_bucket)) > 0'; do
          attempts=0
          until curl -fsSG --data-urlencode "query=$$expression" \
            http://prometheus:9090/api/v1/query | grep -Fq '"result":[{'; do
            attempts=$$((attempts + 1))
            if test "$$attempts" -ge 60; then
              echo "Prometheus expression did not converge: $$expression" >&2
              exit 1
            fi
            sleep 1
          done
        done
        attempts=0
        until curl -fsS http://grafana:3000/api/health | grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"'; do
          attempts=$$((attempts + 1)); test "$$attempts" -lt 60; sleep 1
        done
        curl -fsS 'http://grafana:3000/api/search?query=RelayGate' |
          grep -q '"uid":"relaygate-overview"'
        echo 'RelayGate Prometheus targets and Grafana dashboard verified'
    depends_on:
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      continuity-ac:
        condition: service_started
      continuity-a-zero:
        condition: service_started
