reason = "queue admission 뒤 open failure와 OFFER_ACCEPTED 유실은 selected ListenerSession·old 미수락 Pipe cleanup과 새 session 복구까지, OPENED 확인 유실은 ConnectorSession·양 Gateway Pipe·RelayStream·accepted endpoint cleanup까지 검증한다. Connector SDK가 `OPENED`를 application에 반환하기 전 cancel하면 Gateway의 OPEN Pipe에 owner `CANCEL`이 도착할 수 있으며, 이는 해당 Pipe만 `RESET(CANCELLED)`로 닫고 sibling Pipe를 유지하는 유효한 경합 종료임을 검증한다. established local ListenerSession 단절은 해당 Pipe와 Connector endpoint만 RESET하고 sibling binding으로 새 Pipe를 열 수 있음을 검증한다. 한쪽 FIN 뒤 반대 방향 생존과 같은 방향 DATA-after-FIN 거절은 public Pipe, RelayStream, PeerTransport와 local·remote GatewayState에서 검증한다. 분산 happy path는 Connector SDK와 Listener SDK가 각각 시작한 CLOSE와 RESET이 Entry Gateway와 Owner Gateway 사이 PeerTransport를 지나 해당 stream만 정리하고 sibling stream은 보존하는 경로를 검증한다. peer OPENING 단계의 조기 DATA/FIN/CLOSE는 ProtocolError RESET 한 번으로 수렴하고 late frame이 stream을 되살리지 못한다. state 테스트는 정상 FIN/CLOSE·RESET·late frame과 양 Gateway 관점의 established Pipe PeerTransport loss를 검증한다. offered/open 양 단계의 모든 Pipe frame은 owner-first 검증하며 foreign sender는 target 불변·offender 종료, unknown Pipe는 no-op, owner invalid phase는 target Pipe-local RESET으로 닫힌다."

